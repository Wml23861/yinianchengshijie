<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 宇宙深空背景 -->
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="75%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#2a2848"/>
      <stop offset="25%" stop-color="#1e1c3a"/>
      <stop offset="50%" stop-color="#151330"/>
      <stop offset="75%" stop-color="#0e0c22"/>
      <stop offset="100%" stop-color="#08061a"/>
    </radialGradient>

    <!-- 中心裂缝光芒 - 从内向外 -->
    <radialGradient id="crackCore" cx="50%" cy="52%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="3%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="8%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#ff8c00" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#cc3300" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 裂缝竖光 -->
    <linearGradient id="crackVertical" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="52%" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="90%" stop-color="#ff8c00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </linearGradient>

    <!-- 金色光芒光晕 -->
    <radialGradient id="goldenHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffae00" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 文字金色渐变 -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="80%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>

    <!-- 文字外层光 -->
    <filter id="titleOuterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur2"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.7" result="glowColor"/>
      <feFlood flood-color="#fff8dc" flood-opacity="0.4" result="innerGlow"/>
      <feComposite in="glowColor" in2="blur1" operator="in" result="outer"/>
      <feComposite in="innerGlow" in2="blur2" operator="in" result="inner"/>
      <feMerge>
        <feMergeNode in="outer"/>
        <feMergeNode in="inner"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 背景光晕模糊 -->
    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>

    <filter id="mediumBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <!-- 星光滤镜 -->
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <!-- 微尘粒子 -->
    <radialGradient id="particle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ====== 背景 ====== -->
  <rect width="900" height="1200" fill="url(#cosmicBg)"/>

  <!-- ====== 远处星光粒子 ====== -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="1.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="780" cy="60" r="1" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="200" cy="150" r="1.2" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="700" cy="180" r="0.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="100" cy="300" r="1" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="800" cy="250" r="1.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="60" cy="500" r="0.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="840" cy="550" r="1.2" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="160" cy="700" r="1" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="750" cy="680" r="0.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="300" cy="60" r="1" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="600" cy="90" r="1.3" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="850" cy="120" r="0.7" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="50" cy="180" r="1.1" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="680" cy="320" r="0.9" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="220" cy="400" r="0.7" fill="#ffd700" filter="url(#starGlow)"/>
  </g>

  <!-- ====== 中央大光晕（裂缝核心） ====== -->
  <ellipse cx="450" cy="620" rx="350" ry="500" fill="url(#crackCore)" filter="url(#bigBlur)"/>
  <ellipse cx="450" cy="600" rx="200" ry="350" fill="url(#goldenHalo)" filter="url(#mediumBlur)"/>

  <!-- ====== 裂缝光束（竖直贯穿） ====== -->
  <rect x="420" y="0" width="60" height="1200" fill="url(#crackVertical)" opacity="0.7"/>
  <rect x="435" y="0" width="30" height="1200" fill="url(#crackVertical)" opacity="0.5"/>

  <!-- 裂缝核心白线 -->
  <line x1="450" y1="200" x2="450" y2="1040" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="448" y1="320" x2="448" y2="940" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="452" y1="370" x2="452" y2="890" stroke="#fff8dc" stroke-width="0.5" opacity="0.3"/>

  <!-- ====== 世界轮廓：裂缝中浮现的城池 ====== -->
  <g opacity="0.15" fill="#1a1410">
    <!-- 左半城池剪影 -->
    <path d="M220,790 L260,760 L290,780 L320,740 L350,765 L380,730 L410,750 L430,720 L450,745 L450,940 L220,940 Z"/>
    <!-- 右半城池剪影 -->
    <path d="M450,745 L470,720 L490,750 L520,730 L550,765 L580,740 L610,780 L640,760 L680,790 L680,940 L450,940 Z"/>
    <!-- 塔楼 -->
    <rect x="280" y="690" width="20" height="100" fill="#1a1410"/>
    <rect x="340" y="670" width="25" height="120" fill="#1a1410"/>
    <rect x="420" y="680" width="22" height="110" fill="#1a1410"/>
    <rect x="470" y="680" width="22" height="110" fill="#1a1410"/>
    <rect x="540" y="670" width="25" height="120" fill="#1a1410"/>
    <rect x="600" y="690" width="20" height="100" fill="#1a1410"/>
    <!-- 塔顶 -->
    <polygon points="290,690 300,640 310,690" fill="#1a1410"/>
    <polygon points="352,670 365,610 377,670" fill="#1a1410"/>
    <polygon points="431,680 442,625 453,680" fill="#1a1410"/>
    <polygon points="480,680 491,625 502,680" fill="#1a1410"/>
    <polygon points="552,670 565,610 577,670" fill="#1a1410"/>
    <polygon points="610,690 620,640 630,690" fill="#1a1410"/>
  </g>

  <!-- ====== 远山层次 ====== -->
  <g opacity="0.08" fill="#0a0806">
    <path d="M0,840 Q100,790 200,820 T400,800 T600,825 T800,795 T900,820 L900,1200 L0,1200 Z"/>
    <path d="M0,880 Q150,840 300,870 T500,850 T700,880 T900,860 L900,1200 L0,1200 Z"/>
  </g>

  <!-- ====== 裂缝边缘不规则光纹 ====== -->
  <g opacity="0.4">
    <path d="M450,240 Q480,390 430,540 T470,740 Q425,940 455,1080"
          fill="none" stroke="#ffd700" stroke-width="3" filter="url(#softBlur)"/>
    <path d="M450,240 Q420,390 470,540 T430,740 Q475,940 445,1080"
          fill="none" stroke="#ffae00" stroke-width="2" filter="url(#softBlur)"/>
  </g>

  <!-- ====== 曼陀罗光环 ====== -->
  <g opacity="0.12">
    <circle cx="450" cy="600" r="160" fill="none" stroke="#ffd700" stroke-width="0.8"/>
    <circle cx="450" cy="600" r="200" fill="none" stroke="#ffd700" stroke-width="0.5"/>
    <circle cx="450" cy="600" r="240" fill="none" stroke="#ffd700" stroke-width="0.3"/>
  </g>

  <!-- ====== 顶部装饰线 ====== -->
  <line x1="280" y1="80" x2="620" y2="80" stroke="#8b6914" stroke-width="1.5" opacity="0.4"/>
  <circle cx="280" cy="80" r="3" fill="#8b6914" opacity="0.5"/>
  <circle cx="620" cy="80" r="3" fill="#8b6914" opacity="0.5"/>
  <circle cx="450" cy="80" r="2" fill="#8b6914" opacity="0.3"/>

  <!-- ====== 主标题：一念成世界 ====== -->
  <g filter="url(#titleOuterGlow)">
    <!-- 标题底影 -->
    <text x="452" y="472" font-family="'SimSun', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif"
          font-size="140" font-weight="bold"
          fill="#000000" fill-opacity="0.25"
          text-anchor="middle" letter-spacing="18">一念成世界</text>
    <!-- 标题主体 -->
    <text x="450" y="468" font-family="'SimSun', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif"
          font-size="140" font-weight="bold"
          fill="url(#titleGold)"
          text-anchor="middle" letter-spacing="18">一念成世界</text>
  </g>

  <!-- ====== 副标题 ====== -->
  <text x="450" y="550" font-family="'KaiTi', 'STKaiti', 'Noto Serif SC', serif"
        font-size="38" fill="#c9a84c" text-anchor="middle" letter-spacing="8"
        opacity="0.9">心界崩塌处，方见本来面目</text>

  <!-- ====== 拼音装饰线 ====== -->
  <text x="450" y="600" font-family="'Times New Roman', 'Georgia', serif"
        font-size="16" fill="#8b7530" text-anchor="middle" letter-spacing="14"
        opacity="0.45">YI NIAN CHENG SHI JIE</text>

  <!-- ====== 底部装饰线 ====== -->
  <line x1="300" y1="630" x2="600" y2="630" stroke="#8b6914" stroke-width="1" opacity="0.3"/>

  <!-- ====== 中央打坐人影（面对裂缝光明） ====== -->
  <g transform="translate(388, 890)" opacity="0.85">
    <!-- 光晕环 -->
    <ellipse cx="62" cy="15" rx="35" ry="40" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>
    <!-- 身体 -->
    <path d="M31,105 Q20,80 31,58 Q36,38 62,32 Q88,38 93,58 Q104,80 93,105 Q80,115 62,115 Q44,115 31,105 Z" fill="#040308"/>
    <!-- 头部 -->
    <circle cx="62" cy="20" r="21" fill="#040308"/>
    <!-- 打坐腿部 -->
    <ellipse cx="62" cy="128" rx="55" ry="22" fill="#040308"/>
  </g>

  <!-- ====== 地面光（打坐下方） ====== -->
  <ellipse cx="450" cy="1020" rx="180" ry="35" fill="#ffd700" opacity="0.06" filter="url(#bigBlur)"/>
  <ellipse cx="450" cy="1020" rx="100" ry="20" fill="#ffd700" opacity="0.1" filter="url(#mediumBlur)"/>

  <!-- ====== 左下右下文言装饰 ====== -->
  <text x="80" y="1080" font-family="'KaiTi', 'STKaiti', serif"
        font-size="18" fill="#5a4530" letter-spacing="4" opacity="0.5">我即宇宙</text>
  <text x="80" y="1110" font-family="'KaiTi', 'STKaiti', serif"
        font-size="18" fill="#5a4530" letter-spacing="4" opacity="0.5">我心即世界</text>

  <text x="820" y="1080" font-family="'KaiTi', 'STKaiti', serif"
        font-size="18" fill="#5a4530" letter-spacing="4" opacity="0.5"
        text-anchor="end">万法唯心</text>
  <text x="820" y="1110" font-family="'KaiTi', 'STKaiti', serif"
        font-size="18" fill="#5a4530" letter-spacing="4" opacity="0.5"
        text-anchor="end">一念三千</text>

  <!-- ====== 印章（右下） ====== -->
  <g transform="translate(740, 1040)">
    <rect x="0" y="0" width="70" height="70" rx="4" fill="none" stroke="#8b0000" stroke-width="2.5" opacity="0.7"/>
    <text x="35" y="30" font-family="'SimSun', serif" font-size="18" fill="#8b0000"
          text-anchor="middle" writing-mode="tb" opacity="0.8">明心</text>
    <text x="35" y="60" font-family="'SimSun', serif" font-size="12" fill="#8b0000"
          text-anchor="middle" opacity="0.7">著</text>
  </g>

  <!-- ====== 底部宣传语 ====== -->
  <text x="450" y="1165" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="20" fill="#6b5530" text-anchor="middle" letter-spacing="5"
        opacity="0.6">东方玄幻 · 心灵修行 · 儒释道智慧</text>

  <!-- ====== 四角装饰 ====== -->
  <g opacity="0.3">
    <path d="M40,1140 L70,1140 L70,1170" fill="none" stroke="#8b6914" stroke-width="1.5"/>
    <path d="M860,1140 L830,1140 L830,1170" fill="none" stroke="#8b6914" stroke-width="1.5"/>
    <path d="M40,150 L70,150 L70,120" fill="none" stroke="#8b6914" stroke-width="1.5"/>
    <path d="M860,150 L830,150 L830,120" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  </g>

  <!-- ====== 微尘光点（裂缝周围飘散） ====== -->
  <g opacity="0.5">
    <circle cx="380" cy="390" r="2" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="520" cy="460" r="1.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="360" cy="550" r="2.5" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="540" cy="600" r="1.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="400" cy="690" r="2" fill="#ffae00" filter="url(#starGlow)"/>
    <circle cx="500" cy="740" r="1.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="350" cy="800" r="2.2" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="550" cy="850" r="1.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="420" cy="900" r="1.5" fill="#ffae00" filter="url(#starGlow)"/>
    <circle cx="480" cy="960" r="2" fill="#ffd700" filter="url(#starGlow)"/>
  </g>
</svg>
