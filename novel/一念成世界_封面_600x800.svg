<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 宇宙深空背景 -->
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="75%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#2a2848"/>
      <stop offset="25%" stop-color="#1e1c3a"/>
      <stop offset="50%" stop-color="#151330"/>
      <stop offset="75%" stop-color="#0e0c22"/>
      <stop offset="100%" stop-color="#08061a"/>
    </radialGradient>

    <!-- 中心裂缝光芒 -->
    <radialGradient id="crackCore" cx="50%" cy="52%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="3%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="8%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#ff8c00" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#cc3300" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 裂缝竖光 -->
    <linearGradient id="crackVertical" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="52%" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="90%" stop-color="#ff8c00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </linearGradient>

    <!-- 文字金色渐变 -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="80%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>

    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur2"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.6" result="glowColor"/>
      <feFlood flood-color="#fff8dc" flood-opacity="0.3" result="innerGlow"/>
      <feComposite in="glowColor" in2="blur1" operator="in" result="outer"/>
      <feComposite in="innerGlow" in2="blur2" operator="in" result="inner"/>
      <feMerge>
        <feMergeNode in="outer"/>
        <feMergeNode in="inner"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>

    <filter id="mediumBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="800" fill="url(#cosmicBg)"/>

  <!-- 星光 -->
  <g opacity="0.5">
    <circle cx="80" cy="50" r="1" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="520" cy="40" r="0.8" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="130" cy="100" r="0.8" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="470" cy="120" r="0.6" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="60" cy="200" r="0.7" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="540" cy="180" r="1" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="40" cy="350" r="0.6" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="560" cy="380" r="0.8" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="200" cy="40" r="0.7" fill="#fff" filter="url(#starGlow)"/>
    <circle cx="400" cy="60" r="0.9" fill="#fff" filter="url(#starGlow)"/>
    <circle cx="100" cy="300" r="0.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="500" cy="290" r="0.7" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="150" cy="450" r="0.6" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="450" cy="470" r="0.5" fill="#ffd700" filter="url(#starGlow)"/>
  </g>

  <!-- 中央大光晕 -->
  <ellipse cx="300" cy="420" rx="240" ry="340" fill="url(#crackCore)" filter="url(#bigBlur)"/>

  <!-- 裂缝光束 -->
  <rect x="280" y="0" width="40" height="800" fill="url(#crackVertical)" opacity="0.6"/>
  <rect x="290" y="0" width="20" height="800" fill="url(#crackVertical)" opacity="0.45"/>

  <!-- 裂缝核心白线 -->
  <line x1="300" y1="160" x2="300" y2="700" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
  <line x1="299" y1="240" x2="299" y2="640" stroke="#fff" stroke-width="0.4" opacity="0.3"/>
  <line x1="301" y1="270" x2="301" y2="600" stroke="#fff8dc" stroke-width="0.4" opacity="0.25"/>

  <!-- 裂缝边缘光纹 -->
  <g opacity="0.35">
    <path d="M300,160 Q320,260 285,370 T310,500 Q282,630 305,730"
          fill="none" stroke="#ffd700" stroke-width="2" filter="url(#mediumBlur)"/>
    <path d="M300,160 Q280,260 315,370 T290,500 Q318,630 295,730"
          fill="none" stroke="#ffae00" stroke-width="1.5" filter="url(#mediumBlur)"/>
  </g>

  <!-- 城池剪影 -->
  <g opacity="0.12" fill="#1a1410">
    <path d="M140,560 L170,540 L195,555 L215,530 L240,545 L260,525 L280,538 L290,530 L300,545 L300,660 L140,660 Z"/>
    <path d="M300,545 L310,530 L320,538 L340,525 L360,545 L385,530 L405,555 L430,540 L460,560 L460,660 L300,660 Z"/>
    <rect x="185" y="500" width="15" height="60" fill="#1a1410"/>
    <rect x="225" y="485" width="18" height="75" fill="#1a1410"/>
    <rect x="355" y="485" width="18" height="75" fill="#1a1410"/>
    <rect x="395" y="500" width="15" height="60" fill="#1a1410"/>
    <polygon points="192,500 200,470 208,500" fill="#1a1410"/>
    <polygon points="234,485 245,450 256,485" fill="#1a1410"/>
    <polygon points="355,485 366,450 377,485" fill="#1a1410"/>
    <polygon points="402,500 410,470 418,500" fill="#1a1410"/>
  </g>

  <!-- 远山 -->
  <g opacity="0.07" fill="#0a0806">
    <path d="M0,590 Q80,560 150,580 T300,570 T450,585 T600,570 L600,800 L0,800 Z"/>
    <path d="M0,620 Q120,600 220,620 T400,605 T600,620 L600,800 L0,800 Z"/>
  </g>

  <!-- 曼陀罗光环 -->
  <g opacity="0.1">
    <circle cx="300" cy="410" r="110" fill="none" stroke="#ffd700" stroke-width="0.6"/>
    <circle cx="300" cy="410" r="140" fill="none" stroke="#ffd700" stroke-width="0.4"/>
    <circle cx="300" cy="410" r="170" fill="none" stroke="#ffd700" stroke-width="0.25"/>
  </g>

  <!-- 顶部装饰线 -->
  <line x1="180" y1="55" x2="420" y2="55" stroke="#8b6914" stroke-width="1" opacity="0.35"/>
  <circle cx="180" cy="55" r="2" fill="#8b6914" opacity="0.4"/>
  <circle cx="420" cy="55" r="2" fill="#8b6914" opacity="0.4"/>
  <circle cx="300" cy="55" r="1.5" fill="#8b6914" opacity="0.25"/>

  <!-- ====== 主标题 ====== -->
  <g filter="url(#titleGlow)">
    <text x="301" y="318" font-family="'SimSun', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif"
          font-size="95" font-weight="bold"
          fill="#000" fill-opacity="0.25"
          text-anchor="middle" letter-spacing="14">一念成世界</text>
    <text x="300" y="315" font-family="'SimSun', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif"
          font-size="95" font-weight="bold"
          fill="url(#titleGold)"
          text-anchor="middle" letter-spacing="14">一念成世界</text>
  </g>

  <!-- 副标题 -->
  <text x="300" y="375" font-family="'KaiTi', 'STKaiti', 'Noto Serif SC', serif"
        font-size="26" fill="#c9a84c" text-anchor="middle" letter-spacing="6"
        opacity="0.85">心界崩塌处，方见本来面目</text>

  <!-- 拼音 -->
  <text x="300" y="415" font-family="'Times New Roman', 'Georgia', serif"
        font-size="12" fill="#8b7530" text-anchor="middle" letter-spacing="10"
        opacity="0.4">YI NIAN CHENG SHI JIE</text>

  <!-- 下方装饰线 -->
  <line x1="195" y1="435" x2="405" y2="435" stroke="#8b6914" stroke-width="0.8" opacity="0.25"/>

  <!-- 打坐人影 -->
  <g transform="translate(260, 590)" opacity="0.85">
    <ellipse cx="40" cy="10" rx="22" ry="26" fill="none" stroke="#ffd700" stroke-width="0.7" opacity="0.25"/>
    <path d="M20,68 Q13,52 20,38 Q23,25 40,21 Q57,25 60,38 Q67,52 60,68 Q52,75 40,75 Q28,75 20,68 Z" fill="#030208"/>
    <circle cx="40" cy="13" r="14" fill="#030208"/>
    <ellipse cx="40" cy="83" rx="36" ry="14" fill="#030208"/>
  </g>

  <!-- 地面光 -->
  <ellipse cx="300" cy="675" rx="120" ry="22" fill="#ffd700" opacity="0.05" filter="url(#bigBlur)"/>
  <ellipse cx="300" cy="675" rx="65" ry="14" fill="#ffd700" opacity="0.08" filter="url(#mediumBlur)"/>

  <!-- 文言装饰 -->
  <text x="50" y="730" font-family="'KaiTi', 'STKaiti', serif"
        font-size="13" fill="#5a4530" letter-spacing="3" opacity="0.4">我即宇宙</text>
  <text x="50" y="750" font-family="'KaiTi', 'STKaiti', serif"
        font-size="13" fill="#5a4530" letter-spacing="3" opacity="0.4">我心即世界</text>
  <text x="550" y="730" font-family="'KaiTi', 'STKaiti', serif"
        font-size="13" fill="#5a4530" letter-spacing="3" opacity="0.4"
        text-anchor="end">万法唯心</text>
  <text x="550" y="750" font-family="'KaiTi', 'STKaiti', serif"
        font-size="13" fill="#5a4530" letter-spacing="3" opacity="0.4"
        text-anchor="end">一念三千</text>

  <!-- 印章 -->
  <g transform="translate(490, 695)">
    <rect x="0" y="0" width="48" height="48" rx="3" fill="none" stroke="#8b0000" stroke-width="1.8" opacity="0.65"/>
    <text x="24" y="20" font-family="'SimSun', serif" font-size="13" fill="#8b0000"
          text-anchor="middle" writing-mode="tb" opacity="0.75">明心</text>
    <text x="24" y="42" font-family="'SimSun', serif" font-size="9" fill="#8b0000"
          text-anchor="middle" opacity="0.65">著</text>
  </g>

  <!-- 底部宣传语 -->
  <text x="300" y="780" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="14" fill="#6b5530" text-anchor="middle" letter-spacing="4"
        opacity="0.5">东方玄幻 · 心灵修行 · 儒释道智慧</text>

  <!-- 四角 -->
  <g opacity="0.25">
    <path d="M25,765 L50,765 L50,785" fill="none" stroke="#8b6914" stroke-width="1"/>
    <path d="M575,765 L550,765 L550,785" fill="none" stroke="#8b6914" stroke-width="1"/>
    <path d="M25,95 L50,95 L50,75" fill="none" stroke="#8b6914" stroke-width="1"/>
    <path d="M575,95 L550,95 L550,75" fill="none" stroke="#8b6914" stroke-width="1"/>
  </g>

  <!-- 微尘光点 -->
  <g opacity="0.4">
    <circle cx="250" cy="270" r="1.5" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="350" cy="310" r="1.2" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="240" cy="370" r="1.8" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="360" cy="400" r="1.3" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="265" cy="470" r="1.5" fill="#ffae00" filter="url(#starGlow)"/>
    <circle cx="335" cy="500" r="1.2" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="230" cy="540" r="1.5" fill="#fff8dc" filter="url(#starGlow)"/>
    <circle cx="370" cy="570" r="1.3" fill="#ffd700" filter="url(#starGlow)"/>
    <circle cx="280" cy="610" r="1" fill="#ffae00" filter="url(#starGlow)"/>
    <circle cx="320" cy="640" r="1.4" fill="#ffd700" filter="url(#starGlow)"/>
  </g>
</svg>
