<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f3ec"/>
      <stop offset="60%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f2ece0"/>
    </linearGradient>

    <radialGradient id="inkBg" cx="50%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#d4c8b0" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#e0d5c0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f0e8d8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2210"/>
      <stop offset="40%" stop-color="#5c3818"/>
      <stop offset="70%" stop-color="#7a4e22"/>
      <stop offset="100%" stop-color="#4a2a10"/>
    </linearGradient>

    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="medBlur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="smlBlur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bgGrad)"/>

  <ellipse cx="450" cy="700" rx="460" ry="380" fill="url(#inkBg)" filter="url(#bigBlur)"/>

  <path d="M0,790 Q240,745 450,775 Q660,745 900,790"
        fill="none" stroke="#c0b090" stroke-width="1" opacity="0.22"/>
  <path d="M0,820 Q310,785 450,810 Q590,785 900,820"
        fill="none" stroke="#c8b898" stroke-width="0.8" opacity="0.12"/>

  <circle cx="450" cy="700" r="65" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.2" filter="url(#smlBlur)"/>
  <circle cx="450" cy="700" r="50" fill="#fffef5" opacity="0.1" filter="url(#medBlur)"/>

  <g transform="translate(425, 870)">
    <path d="M-26,14 Q0,-6 38,12 Q28,20 0,17 Q-14,15 -26,14 Z"
          fill="#9b8060" opacity="0.22"/>
    <line x1="6" y1="12" x2="6" y2="-24" stroke="#6b5030" stroke-width="3" opacity="0.35"/>
    <circle cx="6" cy="-35" r="10" fill="#6b5030" opacity="0.3"/>
    <circle cx="6" cy="-35" r="18" fill="#c9a84c" opacity="0.07" filter="url(#smlBlur)"/>
  </g>
  <ellipse cx="450" cy="900" rx="55" ry="5" fill="#c9a84c" opacity="0.04" filter="url(#medBlur)"/>

  <!-- 主标题 -->
  <g filter="url(#softShadow)">
    <text x="450" y="500" font-family="'SimSun','Noto Serif SC','Source Han Serif SC','STSong',serif"
          font-size="280" font-weight="bold"
          fill="url(#goldTitle)"
          text-anchor="middle" letter-spacing="16">心界</text>
  </g>

  <!-- 标语 -->
  <text x="450" y="610" font-family="'KaiTi','STKaiti','Noto Serif SC',serif"
        font-size="52" fill="#7a5c38" text-anchor="middle" letter-spacing="10"
        opacity="0.85">人有一身，心有一界</text>

  <line x1="300" y1="670" x2="600" y2="670" stroke="#c9a84c" stroke-width="1" opacity="0.25"/>

  <!-- 文句 -->
  <text x="450" y="750" font-family="'KaiTi','STKaiti','Noto Serif SC',serif"
        font-size="44" fill="#8b6b40" text-anchor="middle" letter-spacing="6"
        opacity="0.75">所谓修行，不过是认识真正的自己</text>

  <!-- 底标 -->
  <text x="450" y="1165" font-family="'Microsoft YaHei','PingFang SC',sans-serif"
        font-size="20" fill="#b8a080" text-anchor="middle" letter-spacing="8"
        opacity="0.4">东方玄幻 · 心灵修行 · 儒释道智慧</text>
</svg>